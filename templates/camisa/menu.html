{% load static %}
{% load mascara %}
{% block menu %}

<style>
    .gm-navbar {
        background-color: #E3A60F;
    }

    @media(max-width: 991px) {
        .gm-nav-container {
            background: #E3A60F;
        }
    }

    .gm-dropdown-menu {
        background: #E3A60F;
    }
</style>

<nav class="gm-navbar">

    <!-- Brand -->
    <a class="gm-brand" href="{% url 'camisa:home' %}">
        <img src="{% static 'img/brasao_guarda.png' %}" alt="brasão">
        <span class="gm-brand-text">Uniforme</span>
    </a>

    <!-- Toggle mobile -->
    <button class="gm-toggler" id="gmToggler" aria-label="Menu">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <line x1="3" y1="6" x2="21" y2="6" />
            <line x1="3" y1="12" x2="21" y2="12" />
            <line x1="3" y1="18" x2="21" y2="18" />
        </svg>
    </button>

    <div class="gm-nav-container" id="gmNavContainer">

        <div class="gm-nav-left">

            <!-- GUARDA 
      {% if request.user|has_group:"super" or request.user|has_group:"Direção" %}
      <div class="gm-dropdown" id="ddGuarda">
        <button class="gm-nav-link" onclick="toggleDD('ddGuarda')">
          Guarda
          <svg class="gm-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9" />
          </svg>
        </button>
        <div class="gm-dropdown-menu">
          <a class="gm-dropdown-item" href="{% url 'guarda:createguarda' %}">Cadastrar</a>
          <a class="gm-dropdown-item" href="{% url 'guarda:readguarda' %}">Listar</a>
        </div>
      </div>
      {% endif %}

      <!-- APOIO 
      {% if request.user|has_group:"super" or request.user|has_group:"Direção" or request.user|has_group:"Comissão" or request.user|has_group:"Entregador_geral" %}
      <div class="gm-dropdown" id="ddApoio">
        <button class="gm-nav-link" onclick="toggleDD('ddApoio')">
          Apoio
          <svg class="gm-chevron" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
        <div class="gm-dropdown-menu">
          <a class="gm-dropdown-item" href="{% url 'app:readapoio' %}">Entregar</a>
          <a class="gm-dropdown-item" href="{% url 'app:relatorio_apoio' %}">Relatório</a>
        </div>
      </div>
      {% endif %}

      <!-- CAMISA -->
            <div class="gm-dropdown" id="ddCamisa">
                <button class="gm-nav-link" onclick="toggleDD('ddCamisa')">
                    <svg fill="none" width="26px" height="26px" viewBox="-1.92 -1.92 67.84 67.84"
                        xmlns="http://www.w3.org/2000/svg" stroke="currentColor" stroke-width="2.5">
                        <g id="SVGRepo_bgCarrier" stroke-width="0"></g>
                        <g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g>
                        <g id="SVGRepo_iconCarrier">
                                <path
                                    d="M5.03,29.4l6.97,4.11v21.9c0,1.18,.96,2.14,2.14,2.14H49.86c1.18,0,2.14-.96,2.14-2.14v-21.9l6.97-4.11c.49-.29,.84-.77,.97-1.32,.13-.55,.02-1.14-.29-1.62l-7.66-11.65v-.07c0-1.18-.96-2.14-2.14-2.14h-5.59l-3.1-5.22c-.3-.5-.8-.84-1.38-.92-.39-.06-.77,.05-1.12,.22h-13.35c-.35-.18-.72-.28-1.12-.22-.58,.08-1.08,.42-1.37,.92l-3.1,5.22h-5.59c-1.18,0-2.14,.96-2.14,2.14l-7.66,11.72c-.31,.47-.42,1.06-.29,1.62s.48,1.04,.97,1.32Zm52.96-1.84l.84-.55-.86,.67-5.96,3.51v-12.74l5.98,9.11Zm-15.57-14.17l-6.75,5.84-2.44-4.98,6.27-5.77,2.92,4.91Zm-10.42-.72l-4.33-3.98h8.66l-4.33,3.98Zm-7.5-4.18l6.27,5.77-2.44,4.98-6.75-5.84,2.92-4.9Zm-10.36,6.11h5.79l8.08,7c.5,.43,1.27,.27,1.55-.32l2.45-4.98,2.45,4.98c.29,.59,1.06,.74,1.55,.32l8.08-7h5.78c.08,0,.14,.06,.14,.14h0V55.42c0,.08-.06,.14-.14,.14H14.14c-.08,0-.14-.06-.14-.14V14.74h0c0-.08,.06-.14,.14-.14ZM6.01,27.56l5.99-9.11v12.74l-5.96-3.51-.51,.86,.48-.98Z">
                                </path>
                            </g>
                        </g>
                    </svg>
                    Camisa
                    <svg class="gm-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                        stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="6 9 12 15 18 9" />
                    </svg>
                </button>
                <div class="gm-dropdown-menu">
                    <a class="gm-dropdown-item" href="{% url 'camisa:findcamisa' %}">Entregar</a>
                    <div class="gm-divider"></div>
                    <a class="gm-dropdown-item" href="{% url 'camisa:minhas_entregas' %}">Minhas Entregas</a>
                    {% if request.user|has_group:"super" or request.user|has_group:"Direção" %}
                    <a class="gm-dropdown-item" href="{% url 'camisa:readcamisa' %}">Todas</a>
                    <div class="gm-divider"></div>
                    <a class="gm-dropdown-item" href="{% url 'camisa:camisa_entregue' %}">Baixar Docs</a>
                    {% endif %}
                </div>
            </div>

            <!-- RELATÓRIOS -->
            <div class="gm-dropdown" id="ddRel">
                <button class="gm-nav-link" onclick="toggleDD('ddRel')">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2" />
                        <rect x="8" y="2" width="8" height="4" rx="1" ry="1" />
                    </svg>
                    Relatórios
                    <svg class="gm-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                        stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="6 9 12 15 18 9" />
                    </svg>
                </button>
                <div class="gm-dropdown-menu">
                    <a class="gm-dropdown-item" href="{% url 'app:monitoramento' %}">Monitoramento</a>
                    <div class="gm-divider"></div>
                    <a class="gm-dropdown-item" href="{% url 'camisa:relatorio_geral' %}">Geral</a>
                    <a class="gm-dropdown-item" href="{% url 'guarda:relatorio_entregas' %}">Entregas</a>
                </div>
            </div>

        </div>

        <!-- USER -->
        <div class="gm-nav-right">
            {% if request.user.is_authenticated %}
            <div class="gm-dropdown" id="ddUser">
                <button class="gm-user-btn" onclick="toggleDD('ddUser')">
                    <img src="{% if request.user.foto %}{{ request.user.foto }}{% else %}{% static 'img/perfil.png' %}{% endif %}"
                        class="gm-user-avatar">
                    {{ request.user.nome }}
                </button>
                <div class="gm-dropdown-menu" style="right:0;left:auto;">
                    <a class="gm-dropdown-item" href="{% url 'app:password_change' %}">Senha</a>
                    <div class="gm-divider"></div>
                    <a class="gm-dropdown-item" href="{% url 'app:logout' %}">Sair</a>
                </div>
            </div>
            {% endif %}
        </div>

    </div>
</nav>

<script>
    function toggleDD(id) {
        const el = document.getElementById(id);
        const isOpen = el.classList.contains('open');
        document.querySelectorAll('.gm-dropdown.open').forEach(d => d.classList.remove('open'));
        if (!isOpen) el.classList.add('open');
    }

    document.addEventListener('click', function (e) {
        if (!e.target.closest('.gm-dropdown')) {
            document.querySelectorAll('.gm-dropdown.open').forEach(d => d.classList.remove('open'));
        }
    });

    document.getElementById('gmToggler').addEventListener('click', function () {
        document.getElementById('gmNavContainer').classList.toggle('open');
    });
</script>

{% endblock %}
