{% load static %}
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>GNSN - Registrar Frequência</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="bg-[#F2F4F7]">
    <header
        class="bg-[#2D5A9E] text-white pt-10 pb-20 rounded-b-[2.5rem] shadow-xl relative overflow-hidden text-center">
        <div class="absolute inset-0 opacity-15 flex items-center justify-center pointer-events-none">
            <img src="{% static 'img/brasao_guarda.png' %}" class="w-80 scale-150">
        </div>

        <div class="relative z-10 flex flex-col items-center">
            <div
                class="w-24 h-24 rounded-full border-4 border-[#FFA500] overflow-hidden mb-3 shadow-md bg-gray-300 flex items-center justify-center text-gray-500 text-3xl font-bold relative">
                <img id="header-foto" src="" alt="Foto do Mirim" class="w-full h-full object-cover hidden">
                <span id="header-silhueta">👤</span>
            </div>

            <h2 id="header-nome" class="text-xl font-extrabold tracking-tight">Escolha um Mirim</h2>
            <p id="header-matricula" class="text-xs opacity-80 mt-1 uppercase font-semibold">Mat. ---- · Guarda Mirim
            </p>

            <div id="header-badge"
                class="mt-3 bg-[#FFA500] text-white px-4 py-1 rounded-full text-[10px] font-bold flex items-center gap-1 shadow-sm uppercase hidden">
                <span>⭐</span> <span id="header-graduacao">Aspirante</span>
            </div>
        </div>
    </header>

    <main class="container mx-auto px-5 -mt-10 relative z-20">
        <div class="max-w-md mx-auto space-y-4">

            <div class="bg-white rounded-[2rem] p-8 shadow-sm">
                <div class="flex items-center gap-2 mb-6">
                    <div class="w-1.5 h-6 bg-[#2D5A9E] rounded-full"></div>
                    <h3 class="text-[#2D5A9E] font-extrabold text-sm uppercase tracking-wide">Registrar Presença</h3>
                </div>

                <form class="space-y-6" method="POST" action="">
                    {% csrf_token %}

                    <div class="space-y-1">
                        <label class="text-[11px] font-bold text-gray-400 uppercase ml-1">Selecionar Mirim</label>
                        <div class="relative">
                            <input type="hidden" name="mirim" id="mirim-id-hidden">

                            <input type="text" id="input-mirim-busca" list="lista-mirins"
                                placeholder="Digite o nome ou matrícula..."
                                class="w-full p-4 bg-[#F8F9FA] border border-gray-100 rounded-2xl text-sm font-semibold text-gray-700 outline-none focus:ring-2 focus:ring-blue-400 transition-all">

                            <datalist id="lista-mirins">
                                {% for mirim in mirins %}
                                <option value="{{ mirim.matricula }} - {{ mirim.nome }}" data-id="{{ mirim.id }}"
                                    data-nome="{{ mirim.nome }}"
                                    data-foto="{% if mirim.foto %}{{ mirim.foto.url }}{% endif %}"
                                    data-matricula="{{ mirim.matricula }}"
                                    data-graduacao="{{ mirim.graduacao|default:'Guarda Mirim' }}"
                                    data-faltas-cirio="{{ mirim.faltas_para_cirio|default:'--' }}">
                                </option>
                                {% endfor %}
                            </datalist>
                        </div>
                    </div>

                    <div class="space-y-1">
                        <label class="text-[11px] font-bold text-gray-400 uppercase ml-1">Evento / Missão</label>
                        <div class="relative">
                            <select name="evento"
                                class="w-full p-4 bg-[#F8F9FA] border border-gray-100 rounded-2xl text-sm font-semibold text-gray-700 outline-none focus:ring-2 focus:ring-blue-400 transition-all appearance-none">
                                <option value="">Selecione a missão...</option>
                                {% for evento in eventos %}
                                <option value="{{ evento.id }}">{{ evento.nome }}</option>
                                {% endfor %}
                            </select>
                            <div class="absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none text-gray-400">▼
                            </div>
                        </div>
                    </div>

                    <button type="submit"
                        class="w-full bg-[#2D5A9E] text-white py-4 rounded-2xl font-black shadow-lg shadow-blue-900/20 active:scale-[0.98] transition-all uppercase text-xs tracking-[0.1em]">
                        Confirmar Frequência
                    </button>
                </form>
            </div>

         
            <div id="card-jornada"
                class="bg-white p-5 rounded-3xl shadow-sm border border-gray-100 flex items-center gap-4 hidden">
                <div class="w-12 h-12 bg-[#2D5A9E] rounded-2xl flex items-center justify-center text-white text-xl">🏆
                </div>
                <div>
                    <p class="text-lg font-bold text-gray-800 leading-none">Jornada do Círio</p>
                    <p id="texto-jornada" class="text-[10px] text-gray-400 mt-1 uppercase font-bold tracking-tighter">
                        Faltam -- presenças para o Círio</p>
                </div>
            </div>

        </div>
    </main>

    <footer class="mt-10 mb-8 text-center">
        <p class="text-[10px] text-gray-400 font-bold uppercase tracking-widest">GNSN · Gestão 2026</p>
    </footer>

    <script>
        const inputBusca = document.getElementById('input-mirim-busca');
        const hiddenInput = document.getElementById('mirim-id-hidden');
        const imgEl = document.getElementById('header-foto');
        const silhuetaEl = document.getElementById('header-silhueta');

        inputBusca.addEventListener('input', function () {
            const val = this.value;
            const options = document.querySelectorAll('#lista-mirins option');
            let itemEncontrado = null;

            for (let i = 0; i < options.length; i++) {
                if (options[i].value === val) {
                    itemEncontrado = options[i];
                    break;
                }
            }

            if (itemEncontrado) {
                // Captura as propriedades injetadas
                const idReal = itemEncontrado.getAttribute('data-id');
                const nomeReal = itemEncontrado.getAttribute('data-nome');
                const foto = itemEncontrado.getAttribute('data-foto');
                const matricula = itemEncontrado.getAttribute('data-matricula');
                const graduacao = itemEncontrado.getAttribute('data-graduacao');
                const faltasCirio = itemEncontrado.getAttribute('data-faltas-cirio');

                hiddenInput.value = idReal;

                // Atualiza textos do Header
                document.getElementById('header-nome').innerText = nomeReal;
                document.getElementById('header-matricula').innerText = `Mat. ${matricula} · Guarda Mirim`;

                // Manipula Badge de Graduação
                document.getElementById('header-graduacao').innerText = graduacao;
                document.getElementById('header-badge').classList.remove('hidden');

                // Manipula Card Informativo
                document.getElementById('texto-jornada').innerText = `Faltam ${faltasCirio} presenças para o Círio`;
                document.getElementById('card-jornada').classList.remove('hidden');

                if (foto && foto.trim() !== '') {
                    imgEl.src = foto;
                    imgEl.classList.remove('hidden');
                    silhuetaEl.classList.add('hidden');
                } else {
                    imgEl.classList.add('hidden');
                    silhuetaEl.classList.remove('hidden');
                }
            } else {
                // Reseta tudo de forma segura caso o campo seja limpo/inválido
                hiddenInput.value = "";
                document.getElementById('header-nome').innerText = "Escolha um Mirim";
                document.getElementById('header-matricula').innerText = "Mat. ---- · Guarda Mirim";
                document.getElementById('header-badge').classList.add('hidden');
                document.getElementById('card-jornada').classList.add('hidden');
                imgEl.classList.add('hidden');
                silhuetaEl.classList.remove('hidden');
            }
        });

        // Trava Front-end comercial: impede envios acidentais com dados inválidos
        document.querySelector('form').addEventListener('submit', function (e) {
            if (!hiddenInput.value) {
                e.preventDefault();
                alert('Por favor, selecione um Mirim válido listado nas opções.');
                inputBusca.focus();
            }
        });
    </script>
</body>

</html>
