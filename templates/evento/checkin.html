{% extends "menu.html" %}
{% block title %}Check-in{% endblock %}

{% block body %}
    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <h4 class="mb-3 text-center">Frequência para {{ e.categoria }} - {{ e.local }} <strong>{{ e.data|date:"d/m/Y" }} {{ e.hora|date:"H:i" }}</strong></h4>
                <h3 class="mb-3 text-center"></h3>

                <form method="post" class="card shadow">
                    <div class="card-body">
                        {% csrf_token %}
                        {{ form.as_p }}
                    </div>

                    <div class="card-footer text-end">
                        <button class="btn btn-success w-100">Registrar Presença</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
{% endblock %}
