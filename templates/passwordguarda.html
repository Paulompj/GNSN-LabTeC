{% extends 'menu.html' %}
{% load static %}
{% block title %}Cadastrar Senha{% endblock %}

{% block body %}
    <div class="container mt-4">
        <h3>Alterar Senha para: {{ guarda }}</h3>

        <form method="POST" class="needs-validation" novalidate id="form-senha">
            {% csrf_token %}
            <div class="mb-3">
                <label for="senha" class="form-label">Senha</label>
                <input type="password" class="form-control" id="senha" name="senha" required>
                <div class="invalid-feedback">Informe a senha.</div>
            </div>
            <div class="mb-3">
                <label for="confirmar_senha" class="form-label">Confirmar Senha</label>
                <input type="password" class="form-control" id="confirmar_senha" name="confirmar_senha" required>
                <div class="invalid-feedback">Confirme a senha.</div>
            </div>

            <button type="submit" class="btn btn-success">Salvar Senha</button>
            <a href="{% url 'app:readguarda' %}" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>

    <script>
        // Validação Bootstrap 5
        (function () {
            'use strict'
            var forms = document.querySelectorAll('.needs-validation')
            Array.prototype.slice.call(forms).forEach(function (form) {
                form.addEventListener('submit', function (event) {
                    if (!form.checkValidity()) {
                        event.preventDefault()
                        event.stopPropagation()
                    }
                    form.classList.add('was-validated')
                }, false)
            })
        })();

        document.getElementById('form-senha').addEventListener('submit', function(event) {
            const senha = document.getElementById('senha').value;
            const confirmar = document.getElementById('confirmar_senha').value;
            let mensagem = '';

            if (senha.length < 8)
                mensagem = "A senha deve ter pelo menos 8 caracteres.";
            else if (!/[A-Z]/.test(senha))
                mensagem = "A senha deve conter pelo menos uma letra maiúscula.";
            else if (!/[a-z]/.test(senha))
                mensagem = "A senha deve conter pelo menos uma letra minúscula.";
            else if (!/[0-9]/.test(senha))
                mensagem = "A senha deve conter pelo menos um número.";
            else if (!/[!@#$%^&*(),.?":{}|<>]/.test(senha))
                mensagem = "A senha deve conter pelo menos um caractere especial.";
            else if (senha !== confirmar)
                mensagem = "As senhas não coincidem.";

            if (mensagem) {
                alert(mensagem);
                event.preventDefault();
            }
        });
    </script>
{% endblock %}
